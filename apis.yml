name: Adku
description: Adku was a big-data e-commerce personalization startup founded around 2010 by former
  Googlers (CEO Ajit Varma with co-founders Carlos Whitt and Jesse Shieh), and an AngelPad alumnus.
  It built machine-learning technology to personalize the online shopping experience for visitors to
  e-commerce sites such as eBay, Amazon, and Zappos. Backed by Battery Ventures, Greylock Partners,
  and True Ventures (roughly $1.49M raised), Adku was acquired by Groupon in February 2012 and is no
  longer an operating, independent company. It has no public developer portal, API, or documentation
  surface; this record is retained in the API Evangelist network as a Battery Ventures portfolio lead
  for historical/enrichment tracking only.
